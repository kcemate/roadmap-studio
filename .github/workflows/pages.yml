name: Publish stable GitHub Pages release

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type publish to approve the public deployment
        required: true
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ inputs.confirm_publish == 'publish' }}
    runs-on: ubuntu-24.04
    container:
      # Keep in sync with requirements-dev.txt and CI.
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    timeout-minutes: 30
    env:
      PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install axe-core (test only)
        run: npm install --prefix tasks/test-artifacts/tools --no-save axe-core@4.10.3
      - name: Prepare the container for Firefox and Git verification
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files --error-unmatch index.html
      - name: Run release gates
        run: python tasks/verify_all.py
      - name: Build stable public package
        run: python tasks/release.py build --public-url "$PUBLIC_URL"
      - name: Verify stable public package
        run: python tasks/verify_release.py release/current --public-url "$PUBLIC_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/current

  deploy:
    if: ${{ inputs.confirm_publish == 'publish' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy stable public URL
        id: deployment
        uses: actions/deploy-pages@v4
