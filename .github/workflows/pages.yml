name: Publish stable GitHub Pages release

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type publish to approve the public deployment
        required: true
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ inputs.confirm_publish == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0 Pillow==12.1.1 PyMuPDF==1.27.2.2
          python -m playwright install --with-deps chromium webkit firefox
          npm install --prefix /tmp/roadmap-audit-tools --no-save axe-core@4.10.3
      - name: Run release gates
        run: python tasks/verify_all.py
      - name: Build stable public package
        run: python tasks/release.py build --output "$RUNNER_TEMP/roadmap-release" --public-url "$PUBLIC_URL"
      - name: Verify stable public package
        run: python tasks/verify_release.py "$RUNNER_TEMP/roadmap-release/current" --public-url "$PUBLIC_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/roadmap-release/current

  deploy:
    if: ${{ inputs.confirm_publish == 'publish' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy stable public URL
        id: deployment
        uses: actions/deploy-pages@v4
