name: Publish stable GitHub Pages release

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type publish to approve the public deployment
        required: true
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ inputs.confirm_publish == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Require passing CI for the release commit
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Publish from main.');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: context.sha,
              status: 'success',
              per_page: 1,
            });
            const verified = data.workflow_runs.find(run =>
              run.head_sha === context.sha && run.head_branch === 'main' &&
              run.event === 'push' && run.conclusion === 'success');
            if (!verified) {
              core.setFailed(`No successful main CI run for ${context.sha}.`);
              return;
            }
            core.info(`Verified release commit through ${verified.html_url}`);
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build stable public package
        run: python tasks/release.py build --public-url "$PUBLIC_URL"
      - name: Verify stable public package
        run: python tasks/verify_release.py release/current --public-url "$PUBLIC_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/current

  deploy:
    if: ${{ inputs.confirm_publish == 'publish' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy stable public URL
        id: deployment
        uses: actions/deploy-pages@v4
