name: CI

# One run per pull-request commit (pushes to other branches are covered by their pull request), plus main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    container:
      # Keep in sync with requirements-dev.txt. Includes browsers and OS libraries.
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        # The Noble image already contains Python 3.12 and pip.
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install axe-core (test only)
        run: npm install --prefix tasks/test-artifacts/tools --no-save axe-core@4.10.3
      - name: Run all release gates
        run: python tasks/verify_all.py
      - name: Fail if the gate changed tracked files
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Upload test results and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-test-artifacts
          path: |
            tasks/test-artifacts/results/
            tasks/test-artifacts/exports/
            tasks/test-artifacts/presentation/
            tasks/test-artifacts/register/
            tasks/test-artifacts/downloads/
          if-no-files-found: warn
          retention-days: 14
