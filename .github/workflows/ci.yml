name: CI

# One run per pull-request commit (pushes to other branches are covered by their pull request), plus main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium webkit firefox
      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium webkit firefox
      - name: Install axe-core (test only)
        run: npm install --prefix tasks/test-artifacts/tools --no-save axe-core@4.10.3
      - name: Run all release gates
        run: python tasks/verify_all.py
      - name: Fail if the gate changed tracked files
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Upload test results and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-test-artifacts
          path: |
            tasks/test-artifacts/results/
            tasks/test-artifacts/exports/
            tasks/test-artifacts/presentation/
            tasks/test-artifacts/register/
            tasks/test-artifacts/downloads/
          if-no-files-found: warn
          retention-days: 14
