name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0 Pillow==12.1.1 PyMuPDF==1.27.2.2
          python -m playwright install --with-deps chromium webkit firefox
          npm install --prefix /tmp/roadmap-audit-tools --no-save axe-core@4.10.3
      - name: Run all release gates
        run: python tasks/verify_all.py
